<!DOCTYPE html>
<html>
<head>
    <title>Available Books</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Available Books</h1>

    <div class="top-bar">

        <a href="{{ url_for('home') }}" class="back-button">
            ← Back to Books
        </a>

    </div>

    <div class="authors-container">

        <table>

            <tr>
                <th>Book</th>
                <th>Copy ID</th>
                <th>Branch</th>
            </tr>

            {% for item in available %}
            <tr>

                <td>{{ item[0] }}</td>
                <td>{{ item[1] }}</td>
                <td>{{ item[2] }}</td>

            </tr>
            {% endfor %}

        </table>

    </div>

</body>
</html>
