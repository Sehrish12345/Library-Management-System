<!DOCTYPE html>
<html>
<head>
    <title>Library Staff</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Library Staff</h1>

    <div class="top-bar">

        <a href="{{ url_for('add_staff') }}" class="add-button">
            + Add Staff
        </a>

        <a href="{{ url_for('home') }}" class="back-button">
            ← Back to Books
        </a>

    </div>

    <div class="authors-container">

        <table>

            <tr>
                <th>Staff ID</th>
                <th>Staff Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Job Title</th>
                <th>Branch ID</th>
                <th>Action</th>
            </tr>

            {% for member in staff_members %}
            <tr>

                <td>{{ member[0] }}</td>
                <td>{{ member[1] }}</td>
                <td>{{ member[2] }}</td>
                <td>{{ member[3] }}</td>
                <td>{{ member[4] }}</td>
                <td>{{ member[5] }}</td>

                <td>

                    <a href="{{ url_for('edit_staff', staff_id=member[0]) }}">
                        Edit
                    </a>

                    <form method="POST"
                          action="{{ url_for('delete_staff', staff_id=member[0]) }}"
                          style="display:inline;">

                        <button type="submit"
                                onclick="return confirm('Are you sure you want to delete this staff member?');">
                            Delete
                        </button>

                    </form>

                </td>

            </tr>
            {% endfor %}

        </table>

    </div>

</body>
</html>
