<!DOCTYPE html>
<html>
<head>
    <title>Member Accounts</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Member Accounts</h1>

    <div class="top-bar">

        <a href="{{ url_for('add_account') }}" class="add-button">
            + Add Transaction
        </a>

        <a href="{{ url_for('home') }}" class="back-button">
            ← Back to Books
        </a>

    </div>

    <div class="authors-container">

        <table>

            <tr>
                <th>Member</th>
                <th>Account ID</th>
                <th>Amount</th>
                <th>Transaction Date</th>
                <th>Status</th>
                <th>Action</th>
            </tr>

            {% for account in accounts %}
            <tr>

                <td>{{ account[0] }}</td>
                <td>{{ account[1] }}</td>
                <td>{{ account[2] }}</td>
                <td>{{ account[3] }}</td>
                <td>{{ account[4] }}</td>

                <td>

                    <a href="{{ url_for('edit_account', account_id=account[1]) }}">
                        Edit
                    </a>

                    <form method="POST"
                          action="{{ url_for('delete_account', account_id=account[1]) }}"
                          style="display:inline;">

                        <button type="submit"
                                onclick="return confirm('Are you sure you want to delete this transaction?');">
                            Delete
                        </button>

                    </form>

                </td>

            </tr>
            {% endfor %}

        </table>

    </div>

</body>
</html>
