<!DOCTYPE html>
<html>
<head>
    <title>Book Copies</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Book Copies</h1>

    <div class="top-bar">

        <a href="{{ url_for('add_book_copy') }}" class="add-button">
            + Add Book Copy
        </a>

        <a href="{{ url_for('home') }}" class="back-button">
            ← Back to Books
        </a>

    </div>

    <div class="authors-container">

        <table>

            <tr>
                <th>Copy ID</th>
                <th>Book</th>
                <th>Branch</th>
                <th>Status</th>
                <th>Action</th>
            </tr>

            {% for copy in copies %}
            <tr>

                <td>{{ copy[0] }}</td>
                <td>{{ copy[1] }}</td>
                <td>{{ copy[2] }}</td>
                <td>{{ copy[3] }}</td>

             <td>

    <a href="{{ url_for('edit_book_copy', copy_id=copy[0]) }}">
        Edit
    </a>

    <form method="POST"
          action="{{ url_for('delete_book_copy', copy_id=copy[0]) }}"
          style="display:inline;">

        <button type="submit"
                onclick="return confirm('Are you sure you want to delete this book copy?');">
            Delete
        </button>

    </form>

</td>
   

            </tr>
            {% endfor %}

        </table>

    </div>

</body>
</html>
