<!DOCTYPE html>
<html>

<head>
    <title>Edit Book</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="form-container">

        <h1>Edit Book</h1>

        <form method="POST" class="book-form">

            <label for="title">
                Title
            </label>

            <input
                type="text"
                id="title"
                name="title"
                value="{{ book[1] }}"
                required
            >


            <label for="isbn">
                ISBN
            </label>

            <input
                type="text"
                id="isbn"
                name="isbn"
                value="{{ book[2] or '' }}"
            >


            <label for="publication_year">
                Publication Year
            </label>

            <input
                type="number"
                id="publication_year"
                name="publication_year"
                value="{{ book[3] or '' }}"
            >


            <label for="publisher">
                Publisher
            </label>

            <input
                type="text"
                id="publisher"
                name="publisher"
                value="{{ book[4] or '' }}"
            >


            <label for="author">
                Author
            </label>

            <input
                type="text"
                id="author"
                name="author"
                list="author-list"
                value="{{ book[5] or '' }}"
                placeholder="Select or type author"
            >

            <datalist id="author-list">
                {% for author in authors %}
                    <option value="{{ author[1] }}">
                {% endfor %}
            </datalist>


            <label for="category">
                Category
            </label>

            <input
                type="text"
                id="category"
                name="category"
                list="category-list"
                value="{{ book[6] or '' }}"
                placeholder="Select or type category"
            >

            <datalist id="category-list">
                {% for category in categories %}
                    <option value="{{ category[1] }}">
                {% endfor %}
            </datalist>


            <button
                type="submit"
                class="update-button"
            >
                Update Book
            </button>

        </form>


        <a
            class="back-button"
            href="{{ url_for('home') }}"
        >
            ← Back to Books
        </a>

    </div>

</body>

</html>
