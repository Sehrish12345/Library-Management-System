<!DOCTYPE html>
<html>
<head>
    <title>Categories</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Book Categories</h1>

    <div class="top-bar">

        <a href="{{ url_for('add_category') }}" class="add-button">
            + Add Category
        </a>

        <a href="{{ url_for('home') }}" class="back-button">
            ← Back to Books
        </a>

    </div>

    <div class="authors-container">

        <table>
            <tr>
                <th>Category ID</th>
                <th>Category Name</th>
                <th>Action</th>
            </tr>

            {% for category in categories %}
            <tr>

                <td>{{ category[0] }}</td>

                <td>{{ category[1] }}</td>

                <td>

                    <a href="{{ url_for('edit_category', category_id=category[0]) }}">
                        Edit
                    </a>

                    <form method="POST"
                          action="{{ url_for('delete_category', category_id=category[0]) }}"
                          style="display:inline;">

                        <button type="submit"
                                onclick="return confirm('Are you sure you want to delete this category?');">
                            Delete
                        </button>

                    </form>

                </td>

            </tr>
            {% endfor %}

        </table>

    </div>

</body>
</html>
