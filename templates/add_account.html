<!DOCTYPE html>
<html>
<head>
    <title>Add Account Transaction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="form-container">

        <h1>Add Account Transaction</h1>

        <form method="POST" class="book-form">

            <label>Member</label>

            <select name="member_id" required>
                <option value="">Select Member</option>

                {% for member in members %}
                <option value="{{ member[0] }}">
                    {{ member[1] }}
                </option>
                {% endfor %}
            </select>

            <label>Borrowing</label>

            <select name="borrowing_id" required>
                <option value="">Select Borrowing</option>

                {% for borrowing in borrowings %}
                <option value="{{ borrowing[0] }}">
                    #{{ borrowing[0] }} - {{ borrowing[1] }} ({{ borrowing[2] }})
                </option>
                {% endfor %}
            </select>

            <label>Amount</label>
            <input type="number"
                   name="amount"
                   step="0.01"
                   min="0"
                   placeholder="Enter amount"
                   required>

            <label>Transaction Date</label>
            <input type="date"
                   name="transaction_date"
                   required>

            <label>Status</label>

            <select name="status" required>
                <option value="Pending">Pending</option>
                <option value="Paid">Paid</option>
                <option value="Unpaid">Unpaid</option>
            </select>

            <button type="submit" class="add-book-button">
                Add Transaction
            </button>

        </form>

        <a class="back-button" href="{{ url_for('member_accounts') }}">
            ← Back to Member Accounts
        </a>

    </div>

</body>
</html>
