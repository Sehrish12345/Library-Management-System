<!DOCTYPE html>
<html>

<head>

    <title>Library Authors</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <h1>Library Authors</h1>


    <div class="top-bar">

        <a
            href="{{ url_for('add_author') }}"
            class="add-button"
        >
            + Add Author
        </a>

    </div>


    <div class="authors-container">

        <table>

            <tr>
                <th>Author ID</th>
                <th>Author Name</th>
                <th>Action</th>
            </tr>


            {% if authors %}

                {% for author in authors %}

                <tr>

                    <td>
                        {{ author[0] }}
                    </td>

                    <td>
                        {{ author[1] }}
                    </td>

                    <td>

                        <a
                            href="{{ url_for('edit_author', author_id=author[0]) }}"
                        >
                            Edit
                        </a>


                        <form
                            method="POST"
                            action="{{ url_for('delete_author', author_id=author[0]) }}"
                            style="display:inline;"
                        >

                            <button
                                type="submit"
                                onclick="return confirm('Are you sure you want to delete this author?');"
                            >
                                Delete
                            </button>

                        </form>

                    </td>

                </tr>

                {% endfor %}

            {% else %}

                <tr>

                    <td
                        colspan="3"
                        class="no-books"
                    >
                        No authors found.
                    </td>

                </tr>

            {% endif %}

        </table>

    </div>


    <div class="top-bar">

        <a
            href="{{ url_for('dashboard') }}"
            class="back-button"
        >
            ← Back to Dashboard
        </a>

    </div>


</body>

</html>
