<!DOCTYPE html>
<html>
<head>
    <title>Edit Branch</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="form-container">

        <h1>Edit Branch</h1>

        <form method="POST" class="book-form">

            <label>Branch Name</label>
            <input type="text"
                   name="branch_name"
                   value="{{ branch[1] }}"
                   required>

            <label>Address</label>
            <input type="text"
                   name="address"
                   value="{{ branch[2] or '' }}">

            <label>Opening Days</label>
            <input type="text"
                   name="opening_days"
                   value="{{ branch[3] or '' }}">

            <label>Opening Time</label>
            <input type="time"
                   name="opening_time"
                   value="{{ branch[4] or '' }}">

            <label>Closing Time</label>
            <input type="time"
                   name="closing_time"
                   value="{{ branch[5] or '' }}">

            <button type="submit" class="update-button">
                Update Branch
            </button>

        </form>

        <a class="back-button" href="{{ url_for('branches') }}">
            ← Back to Branches
        </a>

    </div>

</body>
</html>
