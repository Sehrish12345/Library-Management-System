<!DOCTYPE html>
<html>

<head>

    <title>Assign Category</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="form-container">

        <h1>Assign Category</h1>

        <form method="POST" class="book-form">

            <label for="category_id">
                Select Category
            </label>

            <select
                id="category_id"
                name="category_id"
                required
            >

                <option value="">
                    Select Category
                </option>

                {% for category in categories %}

                <option value="{{ category[0] }}">
                    {{ category[1] }}
                </option>

                {% endfor %}

            </select>


            <button
                type="submit"
                class="add-book-button"
            >
                + Assign Category
            </button>

        </form>


        <a
            href="{{ url_for('book_details', book_id=book_id) }}"
            class="back-button"
        >
            ← Back to Book Details
        </a>

    </div>

</body>

</html>
